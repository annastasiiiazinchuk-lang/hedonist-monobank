services:
  - type: web
    name: hedonist-monobank
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: hedonist-monobank-db
          property: connectionString
      - key: MONO_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: REDIRECT_URL
        sync: false
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_STORE_URL
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_ADMIN_ACCESS_TOKEN
        sync: false
      - key: NOVA_POSHTA_API_KEY
        sync: false
      - key: META_PIXEL_ID
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_GRAPH_VERSION
        value: v23.0
    healthCheckPath: /api/health
    autoDeploy: true
    plan: free

databases:
  - name: hedonist-monobank-db
    plan: free
