services:
  db:
    image: postgres:16-alpine
    container_name: shopify-monobank-db
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "effective_cache_size=128MB", "-c", "work_mem=2MB"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: shopify_monobank
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -h localhost']
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M

  app:
    build: .
    container_name: shopify-monobank-app
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SHOPIFY_CLIENT_ID: ${SHOPIFY_CLIENT_ID}
      SHOPIFY_CLIENT_SECRET: ${SHOPIFY_CLIENT_SECRET}
      SHOPIFY_STORE_DOMAIN: ${SHOPIFY_STORE_DOMAIN}
      SHOPIFY_STORE_URL: ${SHOPIFY_STORE_URL}
      SHOPIFY_ADMIN_ACCESS_TOKEN: ${SHOPIFY_ADMIN_ACCESS_TOKEN}
      MONO_TOKEN: ${MONO_TOKEN}
      WEBHOOK_URL: ${WEBHOOK_URL}
      REDIRECT_URL: ${REDIRECT_URL}
      NOVA_POSHTA_API_KEY: ${NOVA_POSHTA_API_KEY}
      META_PIXEL_ID: ${META_PIXEL_ID}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v23.0}
      PORT: ${PORT:-3000}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: sh -c "bunx prisma migrate deploy && bun run index.ts"

volumes:
  postgres_data:
